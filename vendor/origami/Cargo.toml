[workspace]

[package]
name = "origami"
version = "0.10.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
adw = { version = "0.9", package = "libadwaita" }
# Local build workaround: v4_22 requires native GTK >= 4.21 (GNOME 50 SDK).
# On a host with GTK 4.20 the sources build against v4_20; see the [patch]
# entry in the root Cargo.toml.
gtk = { version = "0.11", package = "gtk4", features = ["v4_20"] }
log = "0.4"
