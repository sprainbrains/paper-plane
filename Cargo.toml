[package]
name = "paper-plane"
version = "0.1.0-beta.5"
authors = ["Marco Melorio <marco.melorio@protonmail.com>", "Marcus Behrendt <marcus.behrendt.86@gmail.com>"]
edition = "2024"
rust-version = "1.92"

[dependencies]
adw = { version = "0.9", package = "libadwaita", features = ["v1_7"] }
anyhow = "1"
async-channel = "2"
ellipse = "0.2"
futures = { version = "0.3", default-features = false }
gettext-rs = { version = "0.7", features = ["gettext-system"] }
gtk = { version = "0.11", package = "gtk4", features = ["gnome_48", "blueprint"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
indexmap = "2"
locale_config = "0.3"
log = "0.4"
ori = { git = "https://github.com/Yach0/origami.git", tag="v0.10.0", package = "origami" }
pretty_env_logger = "0.5"
qrcode-generator = { version = "5", default-features = false }
regex = "1"
rlt = { package = "gtk-rlottie", git = "https://github.com/Yach0/gtk-rlottie-rs.git", tag = "v0.10.0" }
shumate = { version = "0.8", package = "libshumate" }
tdlib = { version = "1.4", package = "tdlib-rs", features = ["pkg-config"] }
temp-dir = "0.2"
thiserror = "2"

[profile.release]
lto = true
codegen-units = 1
